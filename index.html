<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body {
          margin: 0;
          padding: 0;
          font-family: "Plus Jakarta Sans", sans-serif;
          overflow: hidden;
      }

      .full-screen {
          width: 100vw;
          height: 100vh;
          position: relative;
          overflow: hidden;
      }

      .pivot-point {
        width: 15px;
        height: 15px;
        background-color: rgb(0, 204, 255);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        display: none;
      }
      
      .selection-mode {
        position: absolute;
        right: 20px;
        top: 20px;
        background-color: rgba(238, 238, 238, 0.5);
        z-index: 2;
        padding: 12px;
        border-radius: 8px;
      }
        .selection-mode .btn-select-mode {
            padding: 8px 16px;
            border: none;
            color: black;
            border-radius: 8px;
            cursor: pointer;
        }
        .selection-mode .btn-select-mode:hover {
            background-color: rgb(0, 204, 255);
        }
        .selection-mode .btn-select-mode.active {
            background-color: rgb(0, 204, 255);
        }
        .frustum-rectangle{
            position: absolute;
            border: 1px solid rgb(0, 204, 255);
            background-color: rgba(0, 204, 255, 0.2);
            display: none;
            z-index: 2;
        }
        .text-markup_text{
            border-bottom: 3px solid #CC00CC;
            position: relative;
            transform: translateX(50%) translateY(-50%);
            pointer-events: all;
            color: #CC00CC;
            font-size: 20px;
            text-shadow: 0 0 2px white;
        }
        .text-markup_input{
            border: none;
            outline: none;
            color: #CC00CC;
            border-bottom: 3px solid #CC00CC;
            position: relative;
            transform: translateX(50%) translateY(-50%);
            pointer-events: all;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="full-screen" id="container">
        <div class="pivot-point" id="pivot-point"></div>
        <div class="selection-mode">
            <button class="btn-select-mode" id="frustumMode">Select</button>
            <button class="btn-select-mode" id="cloudMarkup">Cloud Markup</button>
            <button class="btn-select-mode" id="arrowMarkup">Arrow Markup</button>
            <button class="btn-select-mode" id="lineMarkup">Line Markup</button>
            <button class="btn-select-mode" id="drawMarkup">Draw Markup</button>
            <button class="btn-select-mode" id="textMarkup">Text Markup</button>
        </div>
        <div class="frustum-rectangle" id="frustumRectangle"></div>
    </div>
    <script type="module" src="main.ts"></script>
</body>
</html>
